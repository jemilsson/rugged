app = "rugged-game"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Set to 1 during judging to avoid cold-start latency on the first request
  # after idle. Cost: shared-cpu-1x-256mb runs ~$1.94/mo always-on; scale
  # back to 0 after judging to return to pay-per-use.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
